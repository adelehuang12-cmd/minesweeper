<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>扫雷 Minesweeper</title>
<style>
  :root {
    --bg: #1c1f26;
    --panel: #262a35;
    --cell: #3a3f4b;
    --cell-hover: #454b5a;
    --revealed: #12151c;
    --accent: #6fb98f;
    --mine: #e0645a;
    --flag: #e0b84c;
    --text: #e8e9ed;
    --border: #10121a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", sans-serif;
  }
  #panel {
    display: flex;
    gap: 24px;
    background: var(--panel);
    padding: 10px 18px;
    border-radius: 10px;
  }
  #board {
    display: grid;
    gap: 2px;
    background: var(--border);
    padding: 6px;
    border-radius: 8px;
  }
  .cell {
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--cell);
    border-radius: 3px;
    cursor: pointer;
    user-select: none;
    font-size: 12px;
    -webkit-touch-callout: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  .cell.revealed { background: var(--revealed); cursor: default; }
  .cell.mine { background: var(--mine); }
  .cell.flagged { color: var(--flag); }
  #reset {
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #12151c;
    font-weight: 600;
    cursor: pointer;
  }
  #difficulty {
  display: flex;
  gap: 8px;
}
#difficulty button {
  padding: 6px 14px;
  border: none;
  border-radius: 6px;
  background: var(--panel);
  color: var(--text);
  cursor: pointer;
}
#difficulty button:hover {
  background: var(--cell-hover);
}
</style>
</head>
<body>

  <h1>扫雷</h1>
  <div id="difficulty">
  <button data-rows="9" data-cols="9" data-mines="10">初级</button>
  <button data-rows="16" data-cols="16" data-mines="40">中级</button>
  <button data-rows="16" data-cols="30" data-mines="99">高级</button>
  </div>
  <div id="panel">
    <span>💣 <span id="mine-count">0</span></span>
    <span id="status">准备开始</span>
  </div>
  <div id="board"></div>
  <button id="reset">重新开始</button>

  <script src="minesweeper.js"></script>
</body>
</html>
